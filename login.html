<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Ambayec Dental Care Clinic</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>

  <div class="auth-container">
    <div class="login-card">
      
      <!-- Back to Homepage Button -->
      <a href="index.html" class="btn-back-home">← Back to Homepage</a>

      <div class="brand-section-header">
        <img src="images/logo.png" alt="Logo" class="clinic-logo-img">
        <div class="brand-title-text">
          <span class="brand-bold-title">AMBAYEC</span>
          <span class="brand-sub-title">DENTAL CARE CLINIC</span>
        </div>
      </div>

      <div class="welcome-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email or Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your email or username..." required>
        </div>

        <div class="form-group">
          <label>Enter Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password..." required>
            <button type="button" class="toggle-password" id="togglePasswordBtn">👁</button>
          </div>
        </div>

        <div class="forgot-wrapper">
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="card-footer">
        <span>Don’t have an account?</span>
        <a href="register.html" class="register-link">Register</a>
      </div>
    </div>
  </div>

  <script src="js/popup.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
