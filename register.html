<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Ambayec Dental Care Clinic</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>

  <div class="auth-container">
    <div class="register-card">
      <div class="brand-header-banner">
        <img src="images/logo.png" alt="Logo" style="width: 42px;">
        <div class="brand-title-text" style="align-items: flex-start;">
          <span class="brand-bold-title" style="font-size: 18px;">AMBAYEC</span>
          <span class="brand-sub-title" style="font-size: 11px;">DENTAL CARE CLINIC</span>
        </div>
      </div>

      <div class="register-header">
        <h2>Create Patient Account</h2>
      </div>

      <form id="registerForm">
        <div class="section-title">Personal Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" class="form-control" placeholder="Enter First Name..." required>
          </div>

          <!-- Middle Name Field -->
          <div class="form-group">
            <label>Middle Name</label>
            <input type="text" id="middleName" class="form-control" placeholder="Enter Middle Name...">
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" class="form-control" placeholder="Enter Last Name..." required>
          </div>

          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob" class="form-control" required>
            <small id="dobHint" class="field-hint">Must be 18 or older.</small>
          </div>

          <div class="form-group">
            <label>Gender</label>
            <select id="gender" class="form-control">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <div class="form-group">
            <label>Contact Number</label>
            <input type="tel" id="contact" class="form-control" placeholder="Enter Contact Number..." required>
          </div>

          <div class="form-group full-width">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter Email Address..." required>
          </div>

          <div class="form-group full-width">
            <label>Address</label>
            <input type="text" id="address" class="form-control" placeholder="Enter Address..." required>
          </div>
        </div>

        <div class="section-title">Account Information</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter Password..." required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password..." required>
          </div>
        </div>

        <!-- Authorization Confirmation Box -->
        <div class="auth-box-container">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="authCheckbox" required>
            <div>
              <strong>I authorize this application to access, process, and securely store my account credentials for the purpose of providing this service.</strong>
              <span class="auth-subtext">I understand that I can revoke this authorization at any time.</span>
            </div>
          </label>
          <div class="auth-action-buttons">
            <button type="button" class="btn-cancel" onclick="window.location.href='login.html'">Cancel</button>
            <button type="submit" class="btn-continue">Continue</button>
          </div>
        </div>

        <div class="card-footer">
          <span>Already have an account?</span>
          <a href="login.html" class="login-link">Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/popup.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
